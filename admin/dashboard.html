<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Administrativo | A.roy_Store</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                Arial,
                sans-serif;

            background: #f1f5f9;

            color: #0f172a;

        }


        /* ==================================================
           LAYOUT
        ================================================== */

        .container {

            width: 100%;
            max-width: 1200px;

            margin: auto;

            padding: 30px;

        }


        /* ==================================================
           HEADER
        ================================================== */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }

        header h1 {

            font-size: 28px;

        }


        .logout {

            background: #dc2626;

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }

        .logout:hover {

            background: #b91c1c;

        }


        /* ==================================================
           STATUS
        ================================================== */

        .status {

            background: white;

            padding: 18px;

            border-radius: 12px;

            margin-bottom: 25px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

        }


        /* ==================================================
           ESTATÍSTICAS
        ================================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;

        }

        .stat {

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

        }

        .stat span {

            display: block;

            color: #64748b;

            margin-bottom: 8px;

        }

        .stat strong {

            font-size: 30px;

        }


        /* ==================================================
           CARD
        ================================================== */

        .card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

            margin-bottom: 30px;

        }

        .card h2 {

            margin-bottom: 20px;

        }


        /* ==================================================
           FORMULÁRIO
        ================================================== */

        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

        }

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }

        .form-group.full {

            grid-column: 1 / -1;

        }

        label {

            font-weight: bold;

            font-size: 14px;

        }

        input,
        textarea,
        select {

            width: 100%;

            border: 1px solid #cbd5e1;

            padding: 12px;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }

        input:focus,
        textarea:focus,
        select:focus {

            border-color: #2563eb;

        }

        textarea {

            min-height: 100px;

            resize: vertical;

        }


        .actions {

            display: flex;

            gap: 10px;

            margin-top: 20px;

        }


        .btn {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

        }

        .btn-primary {

            background: #2563eb;

            color: white;

        }

        .btn-primary:hover {

            background: #1d4ed8;

        }

        .btn-secondary {

            background: #64748b;

            color: white;

        }


        /* ==================================================
           TABELA
        ================================================== */

        .table-wrapper {

            overflow-x: auto;

        }

        table {

            width: 100%;

            border-collapse: collapse;

        }

        th,
        td {

            padding: 14px;

            text-align: left;

            border-bottom:
                1px solid #e2e8f0;

        }

        th {

            background: #f8fafc;

            font-size: 14px;

        }


        .product-image {

            width: 55px;

            height: 55px;

            object-fit: cover;

            border-radius: 8px;

            background: #e2e8f0;

        }


        .edit {

            background: #f59e0b;

            color: white;

        }

        .delete {

            background: #dc2626;

            color: white;

        }

        .small-btn {

            border: none;

            padding: 8px 12px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            margin-right: 5px;

        }


        /* ==================================================
           RESPONSIVO
        ================================================== */

        @media (max-width: 700px) {

            .container {

                padding: 15px;

            }

            header {

                align-items: flex-start;

                gap: 15px;

            }

            header h1 {

                font-size: 22px;

            }

            .stats {

                grid-template-columns: 1fr;

            }

            .form-grid {

                grid-template-columns: 1fr;

            }

            .form-group.full {

                grid-column: auto;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==================================================
         HEADER
    ================================================== -->

    <header>

        <h1>
            🛍️ A.roy_Store
        </h1>

        <button
            class="logout"
            onclick="fazerLogout()"
        >
            Sair
        </button>

    </header>


    <!-- ==================================================
         STATUS
    ================================================== -->

    <div
        class="status"
        id="status"
    >
        Verificando acesso...
    </div>


    <!-- ==================================================
         ESTATÍSTICAS
    ================================================== -->

    <div class="stats">

        <div class="stat">

            <span>
                Total de produtos
            </span>

            <strong id="totalProdutos">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Produtos em estoque
            </span>

            <strong id="produtosEstoque">
                0
            </strong>

        </div>


        <div class="stat">

            <span>
                Sem estoque
            </span>

            <strong id="produtosSemEstoque">
                0
            </strong>

        </div>

    </div>


    <!-- ==================================================
         ADICIONAR / EDITAR PRODUTO
    ================================================== -->

    <div class="card">

        <h2 id="formTitulo">
            ➕ Adicionar produto
        </h2>


        <form id="produtoForm">


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Preço (Kz)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Categoria
                    </label>

                    <select id="category">

                        <option value="">
                            Selecionar categoria
                        </option>

                        <option value="Telefones">
                            Telefones
                        </option>

                        <option value="Computadores">
                            Computadores
                        </option>

                        <option value="Games/Acessórios">
                            Games/Acessórios
                        </option>

                        <option value="Acessórios">
                            Acessórios
                        </option>

                        <option value="Outros">
                            Outros
                        </option>

                    </select>

                </div>

<div class="form-group">

    <label>
        Armazenamento
    </label>

    <input
        type="text"
        id="storage"
        placeholder="Ex: 128GB"
    >

</div>


<div class="form-group">

    <label>
        Cor
    </label>

    <input
        type="text"
        id="color"
        placeholder="Ex: Preto"
    >

</div>


<div class="form-group">

    <label>
        Bateria
    </label>

    <input
        type="text"
        id="battery"
        placeholder="Ex: 92%"
    >

</div>


<div class="form-group">

    <label>
        Estado
    </label>

    <select id="condition">

        <option value="">
            Selecionar estado
        </option>

        <option value="Novo">
            Novo
        </option>

        <option value="Semi-novo">
            Semi-novo
        </option>

        <option value="Usado">
            Usado
        </option>

        <option value="Recondicionado">
            Recondicionado
        </option>

    </select>

</div>
                <div class="form-group">

                    <label>
                        Estoque
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        value="0"
                    >

                </div>

               
                <div class="form-group full">

                    <label>
                        URL da imagem
                    </label>

                    <input
                        type="text"
                        id="image"
                        placeholder="images/produtos/iphone.jpg"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Descrição
                    </label>

                    <textarea
                        id="description"
                        placeholder="Descrição do produto..."
                    ></textarea>

                </div>


            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="submitBtn"
                >
                    Adicionar produto
                </button>

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelBtn"
                    onclick="cancelarEdicao()"
                    style="display:none"
                >
                    Cancelar
                </button>

            </div>


        </form>

    </div>


    <!-- ==================================================
         PRODUTOS
    ================================================== -->

    <div class="card">

        <h2>
            📦 Produtos
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Imagem
                        </th>

                        <th>
                            Produto
                        </th>

                        <th>
                            Categoria
                        </th>

                        <th>
                            Preço
                        </th>

                        <th>
                            Estoque
                        </th>

                        <th>
                            Ações
                        </th>

                    </tr>

                </thead>


                <tbody id="productsTable">

                    <tr>

                        <td colspan="6">
                            Carregando produtos...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


</div>

<script>

// ======================================================
// VARIÁVEL DE EDIÇÃO
// ======================================================

let produtoEditando = null;


// ======================================================
// VERIFICAR ADMIN
// ======================================================

async function verificarAdmin() {

    try {

        const resposta = await fetch(
            "/api/admin",
            {
                credentials: "include"
            }
        );

        const dados = await resposta.json();

        if (!dados.success) {

            window.location.href = "/conta.html";

            return;

        }

        document.getElementById("status").textContent =
            `Administrador: ${dados.user.name}`;

        carregarProdutos();

    } catch (error) {

        console.error(
            "Erro ao verificar administrador:",
            error
        );

        window.location.href = "/conta.html";

    }

}


// ======================================================
// CARREGAR PRODUTOS
// ======================================================

async function carregarProdutos() {

    try {

        const resposta = await fetch(
            "/api/products"
        );

        const produtos = await resposta.json();

        if (!resposta.ok || !Array.isArray(produtos)) {

            console.error(
                "Erro ao carregar produtos:",
                produtos
            );

            return;

        }

        console.log("Produtos recebidos:", produtos);

        mostrarProdutos(produtos);

        atualizarEstatisticas(produtos);

    } catch (error) {

        console.error(
            "Erro ao carregar produtos:",
            error
        );

    }

}


// ======================================================
// MOSTRAR PRODUTOS
// ======================================================

function mostrarProdutos(produtos) {

    const tabela =
        document.getElementById("productsTable");

    tabela.innerHTML = "";


    if (produtos.length === 0) {

        tabela.innerHTML = `
            <tr>
                <td colspan="6">
                    Nenhum produto cadastrado.
                </td>
            </tr>
        `;

        return;

    }


    produtos.forEach(produto => {

        const linha =
            document.createElement("tr");


        linha.innerHTML = `

            <td>

                ${
                    produto.image

                    ? `
                        <img
                            src="${produto.image}"
                            class="product-image"
                            alt="${produto.name}"
                        >
                    `

                    : `
                        <div
                            class="product-image"
                        ></div>
                    `
                }

            </td>


            <td>

                <strong>
                    ${produto.name || "-"}
                </strong>

            </td>


            <td>

                ${produto.category || "-"}

            </td>


            <td>

                ${Number(produto.price || 0)
                    .toLocaleString("pt-AO")}

                Kz

            </td>


            <td>

                ${produto.stock ?? 0}

            </td>


            <td>

                <button
                    class="small-btn edit"
                    onclick="editarProduto(${produto.id})"
                >
                    Editar
                </button>


                <button
                    class="small-btn delete"
                    onclick="excluirProduto(${produto.id})"
                >
                    Excluir
                </button>

            </td>

        `;


        tabela.appendChild(linha);

    });

}


// ======================================================
// ESTATÍSTICAS
// ======================================================

function atualizarEstatisticas(produtos) {

    const total =
        produtos.length;


    const estoque =
        produtos.filter(
            produto =>
                Number(produto.stock) > 0
        ).length;


    const semEstoque =
        produtos.filter(
            produto =>
                Number(produto.stock) <= 0
        ).length;


    document.getElementById(
        "totalProdutos"
    ).textContent = total;


    document.getElementById(
        "produtosEstoque"
    ).textContent = estoque;


    document.getElementById(
        "produtosSemEstoque"
    ).textContent = semEstoque;

}


// ======================================================
// ADICIONAR / EDITAR PRODUTO
// ======================================================

document.getElementById(
    "produtoForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ==================================================
        // PEGAR TODOS OS DADOS DO FORMULÁRIO
        // ==================================================

        const produto = {

            name:
                document.getElementById(
                    "name"
                ).value.trim(),


            description:
                document.getElementById(
                    "description"
                ).value.trim(),


            price:
                Number(
                    document.getElementById(
                        "price"
                    ).value
                ),


            image:
                document.getElementById(
                    "image"
                ).value.trim(),


            category:
                document.getElementById(
                    "category"
                ).value,


            stock:
                Number(
                    document.getElementById(
                        "stock"
                    ).value
                ),


            // ==============================================
            // NOVOS DETALHES
            // ==============================================

            storage:
                document.getElementById(
                    "storage"
                )
                ? document.getElementById(
                    "storage"
                ).value.trim()
                : "",


            color:
                document.getElementById(
                    "color"
                )
                ? document.getElementById(
                    "color"
                ).value.trim()
                : "",


            battery:
                document.getElementById(
                    "battery"
                )
                ? document.getElementById(
                    "battery"
                ).value.trim()
                : "",


            condition:
                document.getElementById(
                    "condition"
                )
                ? document.getElementById(
                    "condition"
                ).value
                : ""

        };


        // ==================================================
        // MOSTRAR NO CONSOLE
        // ==================================================

        console.log(
            "📦 Produto que será enviado:",
            produto
        );


        try {

            let resposta;


            // ==================================================
            // EDITAR
            // ==================================================

            if (produtoEditando) {

                resposta =
                    await fetch(
                        `/api/products/${produtoEditando}`,
                        {
                            method: "PUT",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    produto
                                )
                        }
                    );

            }


            // ==================================================
            // ADICIONAR
            // ==================================================

            else {

                resposta =
                    await fetch(
                        "/api/products",
                        {
                            method: "POST",

                            credentials: "include",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    produto
                                )
                        }
                    );

            }


            // ==================================================
            // RESPOSTA DO SERVIDOR
            // ==================================================

            const dados =
                await resposta.json();


            console.log(
                "📥 Resposta do servidor:",
                dados
            );


            if (!resposta.ok) {

                alert(
                    dados.error ||
                    dados.message ||
                    "Erro ao guardar produto."
                );

                return;

            }


            alert(
                produtoEditando
                    ? "Produto atualizado com sucesso!"
                    : "Produto adicionado com sucesso!"
            );


            limparFormulario();


            // Atualizar lista
            await carregarProdutos();


        } catch (error) {

            console.error(
                "Erro ao guardar produto:",
                error
            );

            alert(
                "Erro ao comunicar com o servidor."
            );

        }

    }
);


// ======================================================
// EDITAR PRODUTO
// ======================================================

async function editarProduto(id) {

    try {

        const resposta =
            await fetch(
                `/api/products/${id}`
            );


        const produto =
            await resposta.json();


        console.log(
            "📦 Produto para editar:",
            produto
        );


        if (!resposta.ok) {

            alert(
                produto.error ||
                "Produto não encontrado."
            );

            return;

        }


        produtoEditando = id;


        // ==================================================
        // DADOS PRINCIPAIS
        // ==================================================

        document.getElementById(
            "name"
        ).value =
            produto.name || "";


        document.getElementById(
            "description"
        ).value =
            produto.description || "";


        document.getElementById(
            "price"
        ).value =
            produto.price ?? "";


        document.getElementById(
            "image"
        ).value =
            produto.image || "";


        document.getElementById(
            "category"
        ).value =
            produto.category || "";


        document.getElementById(
            "stock"
        ).value =
            produto.stock ?? 0;


        // ==================================================
        // DETALHES DO PRODUTO
        // ==================================================

        const storage =
            document.getElementById("storage");

        if (storage) {

            storage.value =
                produto.storage || "";

        }


        const color =
            document.getElementById("color");

        if (color) {

            color.value =
                produto.color || "";

        }


        const battery =
            document.getElementById("battery");

        if (battery) {

            battery.value =
                produto.battery || "";

        }


        const condition =
            document.getElementById("condition");

        if (condition) {

            condition.value =
                produto.condition || "";

        }


        // ==================================================
        // ALTERAR INTERFACE
        // ==================================================

        document.getElementById(
            "formTitulo"
        ).textContent =
            "✏️ Editar produto";


        document.getElementById(
            "submitBtn"
        ).textContent =
            "Guardar alterações";


        document.getElementById(
            "cancelBtn"
        ).style.display =
            "inline-block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


    } catch (error) {

        console.error(
            "Erro ao carregar produto:",
            error
        );

        alert(
            "Erro ao carregar produto."
        );

    }

}


// ======================================================
// EXCLUIR PRODUTO
// ======================================================

async function excluirProduto(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este produto?"
        );


    if (!confirmar) {

        return;

    }


    try {

        const resposta =
            await fetch(
                `/api/products/${id}`,
                {
                    method: "DELETE",

                    credentials:
                        "include"
                }
            );


        const dados =
            await resposta.json();


        if (!resposta.ok) {

            alert(
                dados.error ||
                "Erro ao excluir produto."
            );

            return;

        }


        alert(
            "Produto excluído com sucesso!"
        );


        carregarProdutos();


    } catch (error) {

        console.error(
            "Erro ao excluir produto:",
            error
        );

        alert(
            "Erro ao comunicar com o servidor."
        );

    }

}


// ======================================================
// CANCELAR EDIÇÃO
// ======================================================

function cancelarEdicao() {

    limparFormulario();

}


// ======================================================
// LIMPAR FORMULÁRIO
// ======================================================

function limparFormulario() {

    produtoEditando = null;


    document.getElementById(
        "produtoForm"
    ).reset();


    document.getElementById(
        "stock"
    ).value = 0;


    document.getElementById(
        "formTitulo"
    ).textContent =
        "➕ Adicionar produto";


    document.getElementById(
        "submitBtn"
    ).textContent =
        "Adicionar produto";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";

}


// ======================================================
// LOGOUT
// ======================================================

async function fazerLogout() {

    try {

        await fetch(
            "/api/auth/logout",
            {
                method: "POST",

                credentials:
                    "include"
            }
        );


        window.location.href =
            "/conta.html";


    } catch (error) {

        console.error(
            "Erro ao fazer logout:",
            error
        );

    }

}


// ======================================================
// INICIAR PAINEL
// ======================================================

verificarAdmin();

</script>


</body>
</html>

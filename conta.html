<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/logos/fav-icon/letra-a.png" type="image/x-icon">
  <title>A.roy_Store</title>
  <link rel="stylesheet" href="estilo/style-conta.css">
  <link rel="stylesheet" href="estilo/style.css">
  <link rel="stylesheet" href="estilo/mediaquerystyle.css">
  <link rel="stylesheet" href="estilo/menu.css">
  <style>
    /* ===== RESET ===== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;

    font-family:Arial, Helvetica, sans-serif;

    background:linear-gradient(
    135deg,
    #0a69f7,
    #004aad,
    #001f54);
}

/* ===== MAIN ===== */
main{
    flex:1;
    background-color: #2c2c2c;
    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;
}

/* ===== WRAPPER ===== */
.account-wrapper{
    width:100%;
    max-width:1100px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:50px;
    align-items:center;
}

/* ===== TEXTO ESQUERDA ===== */
.account-left{
    color:white;
}

.account-left img{
    width:180px;
    max-width:100%;
    margin-bottom:20px;
}

.account-left h1{
    font-size:3rem;
    margin-bottom:15px;
}

.account-left p{
    font-size:1.1rem;
    line-height:1.8;
}

/* ===== FORMULÁRIO ===== */
.container{
    width:100%;
    max-width:450px;
    margin:auto;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:20px;
    padding:35px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.25);
}

.container h2{
    color:white;
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    display:flex;
    flex-direction:column;
    margin-bottom:18px;
    position:relative;
}

.form-group label{
    color:white;
    margin-bottom:8px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    outline:none;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:45px;
    cursor:pointer;
}

.btn{
    width:100%;
    padding:14px;

    border:none;
    border-radius:50px;

    background:white;
    color:#0a69f7;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.forgot-password{
    display:block;
    margin-top:15px;
    text-align:center;
    color:white;
    cursor:pointer;
}

.separator{
    margin:25px 0;
    text-align:center;
    color:white;
}

/* ===== REDES SOCIAIS ===== */
.social-login{
    display:flex;
    gap:10px;
}

.social-login button{
    flex:1;
    padding:12px;

    border:none;
    border-radius:10px;

    cursor:pointer;
    font-weight:bold;
}

/* ===== LINKS ===== */
.toggle-form{
    margin-top:20px;
    text-align:center;
    color:white;
    cursor:pointer;
}

.hidden{
    display:none;
}

/* ===== TABLET ===== */
@media(max-width:768px){

    .account-wrapper{
        grid-template-columns:1fr;
        gap:30px;
    }

    .account-left{
        text-align:center;
    }

    .account-left h1{
        font-size:2.2rem;
    }

    .account-left p{
        font-size:1rem;
    }

    .container{
        max-width:500px;
    }
}

/* ===== TELEMÓVEL ===== */
@media(max-width:480px){

    main{
        padding:25px 15px;
    }

    .account-left img{
        width:120px;
    }

    .account-left h1{
        font-size:1.8rem;
    }

    .account-left p{
        font-size:.95rem;
    }

    .container{
        padding:25px 18px;
        border-radius:15px;
    }

    .social-login{
        flex-direction:column;
    }

    .social-login button{
        width:100%;
    }

    .btn{
        padding:13px;
    }
}
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <div class="navbar show-menu">
    <div class="headerconteiner">
      <a href="index.html"><img src="images/a.roy/logo.png" alt="" class="logo"></a>
      <nav>
        <ul class="show menu" id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="contacto-nos.html">Contato</a></li>
          <li><a href="conta.html">Conta</a></li>
        </ul>
      </nav>
      <div class="navicon">
        <a href="produtos.html"><img src="images/logos/cart.png"> </a> 
        <div class="navicon2">
          <div class="hamburger" id="hamburger">
            <div></div>
            <div></div>
            <div></div>
          </div>
        </div>
      </div>
    </div>  
  </div>

  <!-- MAIN -->
<main>

    <div class="account-wrapper">

        <div class="account-left">
            <img src="images/a.roy/logo.png" alt="A.roy Store">
            <h1>Bem-vindo à A.roy Store</h1>
            <p>
                Entre na sua conta para acompanhar encomendas,
                guardar favoritos e ter uma experiência personalizada.
            </p>
        </div>

        <div class="account-right">

            <!-- LOGIN -->
            <div class="container">

                <div id="loginForm">

                    <h2>Entrar</h2>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Digite o seu email"
                        required>
                    </div>

                    <div class="form-group">
                        <label>Palavra-passe</label>
                        <input
                        type="password"
                        id="loginPassword"
                        name="senha"
                        placeholder="Digite a sua palavra-passe"
                        required>

                        <span
                        class="toggle-password"
                        onclick="togglePassword('loginPassword', this)">
                        👁️
                        </span>
                    </div>

                   <button
                         class="btn"
                         type="button"
                         onclick="fazerLogin()">
                         Entrar
                   </button>

                    <span
                    class="forgot-password"
                    onclick="openModal()">
                    Esqueceu-se da palavra-passe?
                    </span>

                    <div class="separator">
                        <span>ou</span>
                    </div>

                    <div class="social-login">
                        <button type="button">Google</button>
                        <button type="button">Facebook</button>
                    </div>

                    <p class="toggle-form" onclick="toggleForms()">
                        Não tem conta?
                        <strong>Criar conta</strong>
                    </p>

                </div>

                <!-- REGISTO -->
                <div id="registerForm" class="hidden">

                    <h2>Criar Conta</h2>

                    <div class="form-group">
                        <label>Nome</label>
                        <input
                        type="text"
                        id="registerName"
                        placeholder="Digite o seu nome">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input
                        type="email"
                        id="registerEmail"
                        placeholder="Digite o seu email">
                    </div>

                    <div class="form-group">
                        <label>Palavra-passe</label>
                        <input
                        type="password"
                        id="registerPassword"
                        placeholder="Crie uma palavra-passe">

                        <span
                        class="toggle-password"
                        onclick="togglePassword('registerPassword', this)">
                        👁️
                        </span>
                    </div>

                    <button
                        class="btn"
                        type="button"
                        onclick="criarConta()">
                        Registar
                    </button>
                    <p class="toggle-form" onclick="toggleForms()">
                        Já tem conta?
                        <strong>Entrar</strong>
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>
 
     <script>
         <!-- menu -->
         
        const hamburger = document.getElementById("hamburger");
        const menu = document.getElementById("menu");
    
        hamburger.addEventListener("click", () => {
          hamburger.classList.toggle("active");
          menu.classList.toggle("show");
        });
      </script>
      
       <script>

// ======================================================
// LOGIN
// ======================================================

async function fazerLogin() {

    const email =
        document.getElementById("loginEmail")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    if (!email || !password) {

        alert(
            "Digite o email e a palavra-passe."
        );

        return;
    }

    try {

        const resposta =
            await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!dados.success) {

            alert(dados.message);

            return;
        }

        alert(
            "Login realizado com sucesso!"
        );

        // Se for administrador
        if (dados.user.role === "admin") {

            window.location.href =
                "/admin/dashboard.html";

        } else {

            // Cliente normal
            window.location.href =
                "/conta.html";

        }

    } catch (error) {

        console.error(error);

        alert(
            "Não foi possível conectar ao servidor."
        );

    }

}


// ======================================================
// CRIAR CONTA
// ======================================================

async function criarConta() {

    const name =
        document.getElementById("registerName")
        .value
        .trim();

    const email =
        document.getElementById("registerEmail")
        .value
        .trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    if (!name || !email || !password) {

        alert(
            "Preencha todos os campos."
        );

        return;
    }

    try {

        const resposta =
            await fetch(
                "/api/auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                }
            );

        const dados =
            await resposta.json();

        if (!dados.success) {

            alert(dados.message);

            return;
        }

        alert(
            "Conta criada com sucesso! Agora pode entrar."
        );

        // Voltar para login
        toggleForms();

        // Limpar campos
        document.getElementById(
            "registerName"
        ).value = "";

        document.getElementById(
            "registerEmail"
        ).value = "";

        document.getElementById(
            "registerPassword"
        ).value = "";

    } catch (error) {

        console.error(error);

        alert(
            "Não foi possível conectar ao servidor."
        );

    }

}


// ======================================================
// LOGOUT
// ======================================================

async function fazerLogout() {

    try {

        await fetch(
            "/api/auth/logout",
            {
                method: "POST",
                credentials: "include"
            }
        );

        window.location.href =
            "/conta.html";

    } catch (error) {

        console.error(error);

    }

}


// ======================================================
// VERIFICAR USUÁRIO
// ======================================================

async function verificarUsuario() {

    try {

        const resposta =
            await fetch(
                "/api/auth/me",
                {
                    credentials: "include"
                }
            );

        const dados =
            await resposta.json();

        if (dados.loggedIn) {

            console.log(
                "Usuário conectado:",
                dados.user
            );

        }

    } catch (error) {

        console.error(error);

    }

}


// ======================================================
// MOSTRAR / ESCONDER SENHA
// ======================================================

function togglePassword(
    inputId,
    element
) {

    const input =
        document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";

        element.textContent = "🙈";

    } else {

        input.type = "password";

        element.textContent = "👁️";

    }

}

</script>
</body>
</html>
